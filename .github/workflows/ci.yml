name: CI

on:
  push:
    # Branch pushes only: a release tag points at a commit that main already tested.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes about a minute; a hung test must fail fast instead of running for hours.
    timeout-minutes: 15
    strategy:
      matrix:
        node: [24, 23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
