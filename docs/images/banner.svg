<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="gentle-teams: Your coding agents, working as a team across repositories.">
  <title>gentle-teams: Your coding agents, working as a team across repositories.</title>
  <defs>
    <radialGradient id="bg" cx="72%" cy="50%" r="75%">
      <stop offset="0" stop-color="#24243a"/>
      <stop offset="1" stop-color="#181825"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#cdd6f4" fill-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="g-api-web" x1="970" y1="220" x2="810" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4befe"/><stop offset="1" stop-color="#a6e3a1"/>
    </linearGradient>
    <linearGradient id="g-api-docs" x1="970" y1="220" x2="1120" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b4befe"/><stop offset="1" stop-color="#fab387"/>
    </linearGradient>
    <linearGradient id="g-web-docs" x1="920" y1="460" x2="1010" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a6e3a1"/><stop offset="1" stop-color="#fab387"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bar  { transform-box: fill-box; transform-origin: 0 50%; }
    .bdg  { transform-box: fill-box; transform-origin: 50% 50%; }
    .ln   { stroke-dasharray: 1; }
    .chk  { stroke-dasharray: 1; }

    /* Base (no animation) = complete final banner. Motion is opt-in. */
    @media (prefers-reduced-motion: no-preference) {
      .w1, .w2, .w3, .ln, .bar, .dot, .bdg, .chk, .halo {
        animation-duration: 9s;
        animation-iteration-count: infinite;
        animation-timing-function: cubic-bezier(.4, 0, .2, 1);
      }
      /* 1. windows fade + slide in */
      .w1 { animation-name: w1; } .w2 { animation-name: w2; } .w3 { animation-name: w3; }
      /* 2. connections draw */
      .l1 { animation-name: l1; } .l2 { animation-name: l2; } .l3 { animation-name: l3; }
      /* 4. placeholder lines type in */
      .a1 { animation-name: a1; } .a2 { animation-name: a2; } .a3 { animation-name: a3; }
      .b1 { animation-name: b1; } .b2 { animation-name: b2; } .b3 { animation-name: b3; }
      .c1 { animation-name: c1; } .c2 { animation-name: c2; } .c3 { animation-name: c3; }
      /* 5. approval badge */
      .bdg { animation-name: bdg; } .chk { animation-name: chk; } .halo { animation-name: halo; }
    }

    /* 3. messages travel along the connections (only where offset-path works) */
    @supports (offset-path: path("M0 0")) {
      @media (prefers-reduced-motion: no-preference) {
        .dot  { cx: 0; cy: 0; offset-rotate: 0deg; opacity: 0; animation-timing-function: ease-in-out; }
        .p1 { offset-path: path("M940 220 Q860 290 830 390"); }
        .p2 { offset-path: path("M1000 220 Q1080 290 1110 390"); }
        .p3 { offset-path: path("M920 470 Q965 490 1010 470"); }
        .d1 { animation-name: d1; } .d2 { animation-name: d2; }
        .d3 { animation-name: d3; } .d4 { animation-name: d4; }
        .d5 { animation-name: d5; }
      }
    }

    @keyframes w1 { 0%      { opacity: 0; transform: translateY(14px); } 9%, 93% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes w2 { 0%, 3%  { opacity: 0; transform: translateY(14px); } 12%, 93% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes w3 { 0%, 7%  { opacity: 0; transform: translateY(14px); } 16%, 93% { opacity: 1; transform: none; } 100% { opacity: 0; } }

    @keyframes l1 { 0%, 13% { stroke-dashoffset: 1; } 24%, 100% { stroke-dashoffset: 0; } 93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l2 { 0%, 17% { stroke-dashoffset: 1; } 28%, 100% { stroke-dashoffset: 0; } 93% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes l3 { 0%, 20% { stroke-dashoffset: 1; } 31%, 100% { stroke-dashoffset: 0; } 93% { opacity: 1; } 100% { opacity: 0; } }

    /* api types first, then web and docs answer */
    @keyframes a1 { 0%, 29% { transform: scaleX(0); } 36%, 100% { transform: none; } }
    @keyframes a2 { 0%, 32% { transform: scaleX(0); } 39%, 100% { transform: none; } }
    @keyframes a3 { 0%, 35% { transform: scaleX(0); } 42%, 100% { transform: none; } }
    @keyframes b1 { 0%, 56% { transform: scaleX(0); } 62%, 100% { transform: none; } }
    @keyframes b2 { 0%, 59% { transform: scaleX(0); } 65%, 100% { transform: none; } }
    @keyframes b3 { 0%, 62% { transform: scaleX(0); } 68%, 100% { transform: none; } }
    @keyframes c1 { 0%, 58% { transform: scaleX(0); } 64%, 100% { transform: none; } }
    @keyframes c2 { 0%, 61% { transform: scaleX(0); } 67%, 100% { transform: none; } }
    @keyframes c3 { 0%, 64% { transform: scaleX(0); } 70%, 100% { transform: none; } }

    /* api -> web, api -> docs (each with a trailing dot), then web -> docs */
    @keyframes d1 { 0%, 42% { offset-distance: 0%; opacity: 0; } 45%, 53% { opacity: 1; } 56%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes d2 { 0%, 45% { offset-distance: 0%; opacity: 0; } 48%, 56% { opacity: .8; } 59%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes d3 { 0%, 44% { offset-distance: 0%; opacity: 0; } 47%, 55% { opacity: 1; } 58%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes d4 { 0%, 47% { offset-distance: 0%; opacity: 0; } 50%, 58% { opacity: .8; } 61%, 100% { offset-distance: 100%; opacity: 0; } }
    @keyframes d5 { 0%, 71% { offset-distance: 0%; opacity: 0; } 73%, 78% { opacity: .9; } 80%, 100% { offset-distance: 100%; opacity: 0; } }

    @keyframes bdg  { 0%, 80% { opacity: 0; transform: scale(.6); } 85%, 93% { opacity: 1; transform: none; } 100% { opacity: 0; transform: none; } }
    @keyframes chk  { 0%, 83% { stroke-dashoffset: 1; } 89%, 100% { stroke-dashoffset: 0; } }
    @keyframes halo { 0%, 84% { opacity: 0; } 90% { opacity: 1; } 93% { opacity: .8; } 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="#1e1e2e"/>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Title block -->
  <g class="mono">
    <text x="96" y="262" font-size="22" fill="#b4befe" fill-opacity="0.85">❯ plugin</text>
    <text x="92" y="336" font-size="68" font-weight="700" fill="#cdd6f4" letter-spacing="-1">gentle<tspan class="sans" dx="2">-</tspan><tspan dx="2">teams</tspan></text>
  </g>
  <g class="sans" font-size="25" fill="#a6adc8">
    <text x="96" y="392">Your coding agents, working as a team</text>
    <text x="96" y="426">across repositories.</text>
  </g>
  <rect x="96" y="462" width="56" height="4" rx="2" fill="#b4befe"/>
  <rect x="160" y="462" width="28" height="4" rx="2" fill="#a6e3a1"/>
  <rect x="196" y="462" width="14" height="4" rx="2" fill="#fab387"/>

  <!-- Connections -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" stroke-opacity="0.75">
    <path class="ln l1" pathLength="1" d="M940 220 Q 860 290 830 390" stroke="url(#g-api-web)"/>
    <path class="ln l2" pathLength="1" d="M1000 220 Q 1080 290 1110 390" stroke="url(#g-api-docs)"/>
    <path class="ln l3" pathLength="1" d="M920 470 Q 965 490 1010 470" stroke="url(#g-web-docs)"/>
  </g>

  <!-- Message dots (static positions are the fallback) -->
  <g filter="url(#glow)">
    <circle class="dot p1 d1" cx="884" cy="296" r="5" fill="#b4befe"/>
    <circle class="dot p1 d2" cx="848" cy="345" r="3.5" fill="#a6e3a1" fill-opacity="0.8"/>
    <circle class="dot p2 d3" cx="1067" cy="281" r="5" fill="#fab387"/>
    <circle class="dot p2 d4" cx="1096" cy="337" r="3.5" fill="#b4befe" fill-opacity="0.8"/>
    <circle class="dot p3 d5" cx="937" cy="476" r="3.5" fill="#a6e3a1" fill-opacity="0.8"/>
  </g>

  <!-- Human-approved badge (web <-> docs) -->
  <g transform="translate(965 480)">
    <g class="bdg">
      <circle class="halo" r="15" fill="#a6e3a1" fill-opacity="0.25" filter="url(#glow)"/>
      <circle r="13" fill="#181825" stroke="#a6e3a1" stroke-width="2"/>
      <path class="chk" pathLength="1" d="M-5.5 0.5 L-1.5 4.5 L6 -4" fill="none" stroke="#a6e3a1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Window: api (active) -->
  <g transform="translate(860 80)">
    <g class="w1" filter="url(#shadow)">
      <rect width="220" height="140" rx="14" fill="#181825" stroke="#b4befe" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 h192 a14 14 0 0 1 14 14 v20 h-220z" fill="#b4befe" fill-opacity="0.12"/>
      <text class="mono" x="18" y="25" font-size="21" fill="#b4befe">api</text>
      <circle cx="198" cy="17" r="9" fill="#b4befe"/>
      <text class="mono" x="18" y="64" font-size="14" fill="#b4befe">❯</text>
      <rect class="bar a1" x="36" y="54" width="110" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.35"/>
      <rect class="bar a2" x="36" y="78" width="150" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.18"/>
      <rect class="bar a3" x="36" y="102" width="80" height="9" rx="4.5" fill="#b4befe" fill-opacity="0.45"/>
    </g>
  </g>

  <!-- Window: web (idle) -->
  <g transform="translate(700 390)">
    <g class="w2" filter="url(#shadow)">
      <rect width="220" height="140" rx="14" fill="#181825" stroke="#a6e3a1" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 h192 a14 14 0 0 1 14 14 v20 h-220z" fill="#a6e3a1" fill-opacity="0.12"/>
      <text class="mono" x="18" y="25" font-size="21" fill="#a6e3a1">web</text>
      <circle cx="198" cy="17" r="7.9" fill="none" stroke="#a6e3a1" stroke-width="2"/>
      <path d="M198 9.1 a7.9 7.9 0 0 1 0 15.8z" fill="#a6e3a1"/>
      <text class="mono" x="18" y="64" font-size="14" fill="#a6e3a1">❯</text>
      <rect class="bar b1" x="36" y="54" width="130" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.35"/>
      <rect class="bar b2" x="36" y="78" width="96" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.18"/>
      <rect class="bar b3" x="36" y="102" width="140" height="9" rx="4.5" fill="#a6e3a1" fill-opacity="0.4"/>
    </g>
  </g>

  <!-- Window: docs (offline) -->
  <g transform="translate(1010 390)">
    <g class="w3" filter="url(#shadow)">
      <rect width="220" height="140" rx="14" fill="#181825" stroke="#fab387" stroke-opacity="0.55" stroke-width="1.5"/>
      <path d="M0 14 a14 14 0 0 1 14 -14 h192 a14 14 0 0 1 14 14 v20 h-220z" fill="#fab387" fill-opacity="0.12"/>
      <text class="mono" x="18" y="25" font-size="21" fill="#fab387">docs</text>
      <circle cx="198" cy="17" r="7.9" fill="none" stroke="#fab387" stroke-width="2"/>
      <text class="mono" x="18" y="64" font-size="14" fill="#fab387">❯</text>
      <rect class="bar c1" x="36" y="54" width="100" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.35"/>
      <rect class="bar c2" x="36" y="78" width="146" height="9" rx="4.5" fill="#cdd6f4" fill-opacity="0.18"/>
      <rect class="bar c3" x="36" y="102" width="70" height="9" rx="4.5" fill="#fab387" fill-opacity="0.4"/>
    </g>
  </g>
</svg>
